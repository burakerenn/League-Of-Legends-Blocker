<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="418" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Start -->
  <rect x="260" y="24" width="280" height="56" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="400" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">You: "Just one game..."</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#57606a">You try to download or launch LoL</text>

  <line x1="360" y1="80" x2="230" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="80" x2="570" y2="116" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Shield 1 -->
  <rect x="60" y="120" width="310" height="84" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="215" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a3069">Shield 1: hosts file</text>
  <text x="215" y="170" text-anchor="middle" font-size="13" fill="#1f2328">Riot websites and download servers</text>
  <text x="215" y="188" text-anchor="middle" font-size="13" fill="#1f2328">point to 0.0.0.0 and can't be reached</text>

  <!-- Shield 2 -->
  <rect x="430" y="120" width="310" height="84" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="585" y="148" text-anchor="middle" font-size="15" font-weight="600" fill="#0a3069">Shield 2: Watchdog</text>
  <text x="585" y="170" text-anchor="middle" font-size="13" fill="#1f2328">Every 3 seconds, kills any program</text>
  <text x="585" y="188" text-anchor="middle" font-size="13" fill="#1f2328">with "League" or "Riot" in its name</text>

  <line x1="215" y1="204" x2="215" y2="236" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="585" y1="204" x2="585" y2="236" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Results -->
  <rect x="60" y="240" width="310" height="56" rx="10" fill="#ffebe9" stroke="#cf222e"/>
  <text x="215" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#82071e">Download and login fail</text>

  <rect x="430" y="240" width="310" height="56" rx="10" fill="#ffebe9" stroke="#cf222e"/>
  <text x="585" y="274" text-anchor="middle" font-size="15" font-weight="600" fill="#82071e">Installer and game won't open</text>

  <!-- Unblock -->
  <rect x="60" y="326" width="680" height="68" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="400" y="354" text-anchor="middle" font-size="15" font-weight="600" fill="#044f1e">Want to remove the block?</text>
  <text x="400" y="377" text-anchor="middle" font-size="13" fill="#1f2328">Wait 10 minutes first, then type a long sentence exactly. The craving usually passes by then.</text>
</svg>
